name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `@leadhunter/database` runs `prisma generate` as part of its build, which
      # needs no live database, so the whole monorepo builds without Postgres.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
